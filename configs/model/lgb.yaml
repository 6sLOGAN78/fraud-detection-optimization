name: lightgbm
params:
  objective: binary
  metric: auc
  boosting_type: gbdt
  n_estimators: 1000
  learning_rate: 0.05
  num_leaves: 31
  max_depth: 8
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  random_state: 42
  n_jobs: -1
early_stopping_rounds: 50
