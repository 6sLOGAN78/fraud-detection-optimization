defaults:
  - data: base_data
  - model: lgb
  - optimization: optuna
  - _self_

project_name: ieee-cis-fraud-detection
seed: 42
cv_folds: 5
verbose: true

mlflow:
  experiment_name: Fraud-Detection-Baseline
  tracking_uri: http://localhost:5000
  log_models: true

dvc:
  params_file: params.yaml

logging:
  level: INFO
  console: true
  json: false

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  feature_store_dir: data/feature_store
  metadata_dir: data/metadata
  reports_dir: reports
  artifacts_dir: artifacts
  experiments_dir: experiments
  logs_dir: logs

eda:
  sample_size: 100000

training:
  max_samples: 200000
  val_ratio: 0.2
  decision_threshold: 0.05

