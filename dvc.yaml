stages:
  load_data:
    cmd: python3 -m src.pipelines.run_data_pipeline --stage load_data
    deps:
      - data/raw/train_transaction.csv
      - data/raw/train_identity.csv
      - data/raw/test_transaction.csv
      - data/raw/test_identity.csv
      - src/pipelines/run_data_pipeline.py
    outs:
      - data/interim/train_transaction.parquet
      - data/interim/train_identity.parquet
      - data/interim/test_transaction.parquet
      - data/interim/test_identity.parquet

  validate_schema:
    cmd: python3 -m src.pipelines.run_data_pipeline --stage validate_schema
    deps:
      - data/interim/train_transaction.parquet
      - src/pipelines/run_data_pipeline.py
    outs:
      - data/metadata/schema.json

  memory_optimization:
    cmd: python3 -m src.pipelines.run_data_pipeline --stage memory_optimization
    deps:
      - data/interim/train_transaction.parquet
      - data/interim/train_identity.parquet
      - data/interim/test_transaction.parquet
      - data/interim/test_identity.parquet
      - src/pipelines/run_data_pipeline.py
    outs:
      - data/interim/train_transaction_opt.parquet
      - data/interim/train_identity_opt.parquet
      - data/interim/test_transaction_opt.parquet
      - data/interim/test_identity_opt.parquet
      - data/metadata/memory_report_train.json

  merge_identity:
    cmd: python3 -m src.pipelines.run_data_pipeline --stage merge_identity
    deps:
      - data/interim/train_transaction_opt.parquet
      - data/interim/train_identity_opt.parquet
      - data/interim/test_transaction_opt.parquet
      - data/interim/test_identity_opt.parquet
      - src/pipelines/run_data_pipeline.py
    outs:
      - data/interim/train_merged.parquet
      - data/interim/test_merged.parquet

  quality_checks:
    cmd: python3 -m src.pipelines.run_data_pipeline --stage quality_checks
    deps:
      - data/interim/train_merged.parquet
      - src/pipelines/run_data_pipeline.py
    outs:
      - data/interim/train_quality.parquet
      - data/metadata/quality_report.json

  missing_analysis:
    cmd: python3 -m src.pipelines.run_data_pipeline --stage missing_analysis
    deps:
      - data/interim/train_quality.parquet
      - src/pipelines/run_data_pipeline.py
    outs:
      - data/interim/train_missing.parquet
      - data/metadata/missing_report.csv

  clean_data:
    cmd: python3 -m src.pipelines.run_data_pipeline --stage clean_data
    deps:
      - data/interim/train_missing.parquet
      - src/pipelines/run_data_pipeline.py
    outs:
      - data/interim/train_cleaned.parquet

  metadata_generation:
    cmd: python3 -m src.pipelines.run_data_pipeline --stage metadata_generation
    deps:
      - data/interim/train_cleaned.parquet
      - src/pipelines/run_data_pipeline.py
    outs:
      - data/metadata/feature_dictionary.json
      - data/metadata/column_groups.json

  drift_analysis:
    cmd: python3 -m src.pipelines.run_data_pipeline --stage drift_analysis
    deps:
      - data/interim/train_cleaned.parquet
      - data/interim/test_transaction_opt.parquet
      - data/interim/test_identity_opt.parquet
      - src/pipelines/run_data_pipeline.py
    outs:
      - data/metadata/drift_report.html
      - data/metadata/psi_scores.csv
      - data/metadata/ks_scores.csv

  feature_store_registration:
    cmd: python3 -m src.pipelines.run_data_pipeline --stage feature_store_registration
    deps:
      - data/interim/train_cleaned.parquet
      - data/metadata/column_groups.json
      - src/pipelines/run_data_pipeline.py
    outs:
      - data/feature_store/

  save_processed_data:
    cmd: python3 -m src.pipelines.run_data_pipeline --stage save_processed_data
    deps:
      - data/interim/train_cleaned.parquet
      - src/pipelines/run_data_pipeline.py
    outs:
      - data/processed/
      - data/metadata/leakage_report.md

  profile:
    cmd: python3 -m src.pipelines.run_profiling
    deps:
      - data/processed/
      - data/interim/test_merged.parquet
      - src/pipelines/run_profiling.py
      - src/eda/profiling.py
    outs:
      - reports/eda/dataset_profile.html
      - reports/eda/dataset_summary.md
      - reports/eda/dataset_profile.json
      - reports/eda/memory_profile.csv
      - reports/eda/feature_dictionary.csv
      - reports/eda/cardinality_report.csv
      - reports/eda/numerical_statistics.csv
      - reports/eda/categorical_statistics.csv
      - reports/eda/completeness_report.csv

  quality_assessment:
    cmd: python3 -m src.pipelines.run_quality_assessment
    deps:
      - data/interim/train_merged.parquet
      - data/interim/test_merged.parquet
      - src/pipelines/run_quality_assessment.py
      - src/eda/quality.py
    outs:
