version: '3.8'

services:
  mlflow:
    image: python:3.12-slim
    container_name: fraud-mlflow-server
    ports:
      - "5000:5000"
    working_dir: /mlflow
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: >
      sh -c "pip install mlflow && mlflow server --host 0.0.0.0 --port 5000"

  api:
    build:
      context: .
      target: api
    container_name: fraud-detection-api
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
