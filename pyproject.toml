[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "catboost.*",
    "xgboost.*",
    "optuna.*",
    "shap.*",
    "missingno.*",
    "plotly.*",
    "matplotlib.*",
    "mlflow.*",
    "dvc.*",
    "hydra.*",
    "omegaconf.*",
]
ignore_missing_imports = true
